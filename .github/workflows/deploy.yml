
name: Deploy SiDOEL ke Rumahweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload SiDOEL via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ambil file dari GitHub
        uses: actions/checkout@v6

      - name: Upload ke Rumahweb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
