
name: Deploy SiDOEL ke Rumahweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload SiDOEL via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ambil file dari GitHub
        uses: actions/checkout@v6

      - name: Upload ke Rumahweb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          timeout: 60000
          # Jangan hapus file di server yang tidak ada di repo (foto upload,
          # vendor, backup, koneksi.local.php) — kalau true, semua terhapus.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            # Konfigurasi & data khusus server (tidak ada di repo)
            **/koneksi.local.php
            **/config.local.php
            **/vendor/**
            **/backup/**
            **/foto_siswa/**
            **/foto_guru/**
            **/cek_server.php
            **/phpinfo.php
            **/*.sql
            **/*.sql.gz
